[pytest]
# Put the repo root on sys.path so ``from aurantium import ...`` resolves.
#
# This is not a convenience. Without it, ``pytest tests/`` cannot import the
# package at all: in pytest's default ``prepend`` import mode the directory
# inserted into sys.path is the first one *above* a test file that has no
# __init__.py — which is ``tests/``, not the repo root. Nothing else puts the
# root there.
#
# ``python -m pytest tests -q`` happens to work regardless, because ``python
# -m`` inserts the current directory into sys.path before pytest ever starts.
# That is the command HANDOFF.md documents and the one used during
# development, which is exactly why the difference stayed invisible: the
# release workflow's test gate runs bare ``pytest tests/ -q`` and had never
# once executed successfully — it was added after v1.7.0 was cut, and v1.8.0
# was tagged only locally, so v1.9.0 was the first tag push to ever reach it.
# All 38 test modules failed collection with ModuleNotFoundError.
#
# Setting it here fixes both invocations rather than just the CI one, so the
# suite behaves the same however it is started.
pythonpath = .
testpaths = tests
